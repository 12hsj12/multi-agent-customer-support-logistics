# EchoMind 智能客服系统 — Docker Compose 服务编排
# 三级记忆架构：Redis（工作记忆）+ ChromaDB（情景记忆 + 用户画像）

services:

  # ── Redis 缓存（工作记忆）────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: echomind-redis
    ports:
      - "127.0.0.1:6379:6379"
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}
    volumes:
      - redis-data:/data
    restart: unless-stopped
    networks:
      - echomind-network
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── ChromaDB 向量数据库（情景记忆 + 用户画像）────────────────────────────────
  chromadb:
    image: chromadb/chroma:0.5.23
    container_name: echomind-chromadb
    ports:
      - "127.0.0.1:8001:8000"
    environment:
      - IS_PERSISTENT=TRUE
      - PERSIST_DIRECTORY=/chroma/chroma
      - ANONYMIZED_TELEMETRY=FALSE
    volumes:
      - chromadb-data:/chroma/chroma
    restart: unless-stopped
    networks:
      - echomind-network
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8000/api/v1/heartbeat || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # ── OpenJev oneshot 决策服务（独立 Node 服务）────────────────────────────────
  # 不发布宿主端口，仅允许 EchoMind 在 Compose 网络内访问。
  openjev:
    build:
      context: .
      dockerfile: openjev/Dockerfile
    env_file:
      - path: .env.openjev
        required: false
    environment:
      - NODE_ENV=production
      - PORT=3001
      - OPENJEV_MODEL=${OPENJEV_MODEL:-deepseek-flash}
      - DECIDER_BASE_URL=${OPENJEV_DECIDER_BASE_URL:-http://decider:8000}
    expose:
      - "3001"
    restart: unless-stopped
    networks:
      - echomind-network
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/api/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 15s
      timeout: 4s
      retries: 5
      start_period: 20s

  # ── Prometheus 监控 ─────────────────────────────────────────────────────────
  prometheus:
    image: prom/prometheus:latest
    container_name: echomind-prometheus
    ports:
      - "127.0.0.1:9090:9090"
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=200h'
      - '--web.enable-lifecycle'
    volumes:
      - ./config/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    restart: unless-stopped
    networks:
      - echomind-network
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:9090/-/healthy || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # ── EchoMind 主应用 ─────────────────────────────────────────────────────────
  echomind:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: echomind-app
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      # 容器内固定值，覆盖 .env 中的本地路径
      - REDIS_URL=redis://:${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}@redis:6379/0
      - CHROMA_PERSIST_DIRECTORY=/app/data/chroma
      - EVAL_BASELINE_PATH=/app/data/eval/baseline.json
      - ECHOMIND_SKILLS_DIR=/app/skills
      - ECHOMIND_DECISION_BACKEND=${ECHOMIND_DECISION_BACKEND:-local}
      - ECHOMIND_LOCAL_DECISION_PROVIDER=${ECHOMIND_LOCAL_DECISION_PROVIDER:-openjev_http}
      - ECHOMIND_OPENJEV_BASE_URL=${ECHOMIND_OPENJEV_BASE_URL:-http://openjev:3001}
      - ECHOMIND_OPENJEV_MODEL=${OPENJEV_MODEL:-deepseek-flash}
      - ECHOMIND_OPENJEV_MODE=${OPENJEV_MODE:-oneshot}
      - ECHOMIND_OPENJEV_TIMEOUT_SECONDS=${ECHOMIND_OPENJEV_TIMEOUT_SECONDS:-8}
      - ECHOMIND_DECIDER_MODEL_PATH=/app/models/decider-2b-v11-Q4_K_M.gguf
      - ECHOMIND_DECIDER_N_CTX=${ECHOMIND_DECIDER_N_CTX:-2048}
      - ECHOMIND_DECIDER_N_THREADS=${ECHOMIND_DECIDER_N_THREADS:-6}
    volumes:
      - ./data/chroma:/app/data/chroma
      - ./data/eval:/app/data/eval
      - ./models:/app/models:ro
      - ./skills:/app/skills
      - ./logs:/app/logs
    depends_on:
      redis:
        condition: service_healthy
      chromadb:
        condition: service_healthy
      openjev:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - echomind-network
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=5).read()"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s

  # ── 固定样本 OpenJev 配对评测（显式 profile 启动）────────────────────────────
  echomind-openjev-benchmark:
    profiles:
      - openjev-benchmark
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    command: ["python", "scripts/openjev_paired_benchmark.py"]
    env_file:
      - .env
    environment:
      - ECHOMIND_OPENJEV_BASE_URL=http://openjev:3001
      - OPENJEV_MODEL=${OPENJEV_MODEL:-deepseek-flash}
      - ECHOMIND_OPENJEV_MODEL=${OPENJEV_MODEL:-deepseek-flash}
      - ECHOMIND_OPENJEV_MODE=oneshot
      - ECHOMIND_OPENJEV_TIMEOUT_SECONDS=${ECHOMIND_OPENJEV_TIMEOUT_SECONDS:-8}
      - ECHOMIND_DECISION_TRIGGER_CONFIDENCE=${ECHOMIND_DECISION_TRIGGER_CONFIDENCE:-0.65}
      - ECHOMIND_LLM_PRIORITY_CONFIDENCE=${ECHOMIND_LLM_PRIORITY_CONFIDENCE:-0.85}
    volumes:
      - ./data/eval:/app/data/eval
    depends_on:
      openjev:
        condition: service_healthy
    networks:
      - echomind-network

  # ── 真实 DeepSeek oneshot 冒烟验证（显式 profile 启动）──────────────────────
  echomind-openjev-real-smoke:
    profiles:
      - openjev-real-smoke
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    command: ["python", "tests/openjev_real_smoke.py"]
    environment:
      - PYTHONPATH=/app
      - ECHOMIND_OPENJEV_BASE_URL=http://openjev:3001
      - ECHOMIND_OPENJEV_MODEL=${OPENJEV_MODEL:-deepseek-flash}
      - ECHOMIND_OPENJEV_MODE=oneshot
      - ECHOMIND_OPENJEV_TIMEOUT_SECONDS=${ECHOMIND_OPENJEV_TIMEOUT_SECONDS:-30}
    depends_on:
      openjev:
        condition: service_healthy
    networks:
      - echomind-network

  # ── Nginx 反向代理 ──────────────────────────────────────────────────────────
  nginx:
    image: nginx:alpine
    container_name: echomind-nginx
    ports:
      - "80:80"
    volumes:
      - ./config/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - nginx-logs:/var/log/nginx
    depends_on:
      echomind:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - echomind-network
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

# ── 网络 ────────────────────────────────────────────────────────────────────
networks:
  echomind-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/16

# ── 数据卷 ──────────────────────────────────────────────────────────────────
volumes:
  redis-data:
  chromadb-data:
  prometheus-data:
  nginx-logs:
